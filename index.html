<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GHOST OPS : TANK COMMANDER</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; touch-action: none; font-family: 'Oswald', sans-serif; }
        #hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; color: white; padding: 20px; display: none; }
        #joystick-zone { position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border: 2px solid white; border-radius: 50%; pointer-events: auto; }
        #fire-btn { position: absolute; bottom: 40px; right: 40px; width: 100px; height: 100px; background: rgba(255,0,0,0.5); border: 2px solid white; border-radius: 50%; pointer-events: auto; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        
        /* ÉCRAN DE CHARGEMENT AMÉLIORÉ */
        #loader { position: absolute; inset: 0; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: #ffcc00; text-align: center; }
        .bar-container { width: 200px; height: 10px; border: 1px solid #ffcc00; margin-top: 20px; }
        #bar-fill { width: 0%; height: 100%; background: #ffcc00; transition: width 0.3s; }
    </style>
</head>
<body>

    <div id="loader">
        <div style="font-size: 28px; font-weight: bold;">INITIALISATION SYSTÈME</div>
        <div id="status" style="margin-top:10px; font-size:14px; color:white;">Chargement des fichiers .glb...</div>
        <div class="bar-container"><div id="bar-fill"></div></div>
        <button id="start-btn" style="display:none; margin-top:30px; padding:15px 40px; background:#ffcc00; border:none; font-weight:bold; cursor:pointer;">PRENDRE LES COMMANDES</button>
    </div>

    <div id="hud">
        <div style="font-size: 18px; letter-spacing: 2px;">STATUS : OPERATIONNEL | M1 ABRAMS</div>
        <div id="joystick-zone"></div>
        <div id="fire-btn">FEU</div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.150.1/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, camera, renderer, clock, tank;
        let moveDir = { x: 0, z: 0 };
        const loader = new GLTFLoader();

                // --- CONFIGURATION DES FICHIERS ---
        // Vérifie que les noms sur GitHub sont EXACTEMENT ceux-là (Majuscules incluses)
        const MODELS = {
            tank: './Tank.glb',
            road: './Road Piece Straight.glb',
            tent: './Military Tent.glb',
            soldier: './Soldier.glb'

        };

        const manager = new THREE.LoadingManager();
        manager.onProgress = (url, itemsLoaded, itemsTotal) => {
            const progress = (itemsLoaded / itemsTotal) * 100;
            document.getElementById('bar-fill').style.width = progress + '%';
        };
        manager.onLoad = () => {
            document.getElementById('status').innerText = "SYSTÈME PRÊT";
            document.getElementById('start-btn').style.display = 'block';
        };
        manager.onError = (url) => {
            document.getElementById('status').innerHTML = "ERREUR : Fichier manquant<br><span style='color:red'>" + url + "</span>";
        };

        const gltfLoader = new GLTFLoader(manager);

        async function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Ciel
            clock = new THREE.Clock();

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputEncoding = THREE.sRGBEncoding;
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const sun = new THREE.DirectionalLight(0xffffff, 1.2);
            sun.position.set(10, 50, 10);
            scene.add(sun);

            // CHARGEMENT DES MODÈLES
            gltfLoader.load(MODELS.road, (gltf) => {
                for(let i=0; i<15; i++) {
                    const r = gltf.scene.clone();
                    r.position.z = -i * 20;
                    scene.add(r);
                }
            });

            gltfLoader.load(MODELS.tent, (gltf) => {
                const t = gltf.scene;
                t.position.set(-8, 0, -10);
                t.scale.set(2, 2, 2);
                scene.add(t);
            });

            gltfLoader.load(MODELS.tank, (gltf) => {
                tank = gltf.scene;
                tank.scale.set(1.5, 1.5, 1.5);
                scene.add(tank);
            });

            setupControls();
            animate();
        }

        document.getElementById('start-btn').onclick = () => {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            init();
        };

        function setupControls() {
            const jz = document.getElementById('joystick-zone');
            jz.addEventListener('touchmove', (e) => {
                const t = e.touches[0];
                const r = jz.getBoundingClientRect();
                moveDir.x = (t.clientX - (r.left + r.width/2)) / 50;
                moveDir.z = (t.clientY - (r.top + r.height/2)) / 50;
            });
            jz.addEventListener('touchend', () => { moveDir = {x:0, z:0}; });
        }

        function animate() {
            requestAnimationFrame(animate);
            if (tank) {
                // Pilotage du tank
                tank.translateZ(-moveDir.z * 0.3);
                tank.rotation.y -= moveDir.x * 0.06;

                // Caméra dynamique Third-Person
                const offset = new THREE.Vector3(0, 6, 12);
                offset.applyQuaternion(tank.quaternion);
                camera.position.copy(tank.position).add(offset);
                camera.lookAt(tank.position.clone().add(new THREE.Vector3(0, 2, 0)));
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
