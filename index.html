<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GHOST OPS : VRAI GRAPHISMES</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; font-family: 'Oswald', sans-serif; }
        #hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; color: white; }
        .crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; }
        #fire-btn { position: absolute; bottom: 40px; right: 40px; width: 100px; height: 100px; background: rgba(255,0,0,0.5); border: 3px solid white; border-radius: 50%; pointer-events: auto; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        #joystick { position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border: 2px solid white; border-radius: 50%; pointer-events: auto; }
    </style>
</head>
<body>

    <div id="hud">
        <div style="font-size: 24px; color: #ffcc00;">OPERATIONS : LIVE</div>
        <div class="crosshair"></div>
        <div id="joystick"></div>
        <div id="fire-btn">FEU</div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.150.1/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, camera, renderer, clock, weapon;
        const loader = new GLTFLoader();

        init();

        function init() {
            scene = new THREE.Scene();
            clock = new THREE.Clock();
            
            // 1. CIEL RÉALISTE (Image 360°)
            const texLoader = new THREE.TextureLoader();
            scene.background = texLoader.load('https://threejs.org/examples/textures/2294472375_b9a84c5c3d_o.jpg');

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.toneMapping = THREE.ACESFilmicToneMapping; // Rendu comme au cinéma
            document.body.appendChild(renderer.domElement);

            // 2. LUMIÈRE DU SOLEIL (Essentiel pour le réalisme)
            const sun = new THREE.DirectionalLight(0xffffff, 2);
            sun.position.set(50, 100, 50);
            scene.add(sun);
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));

            // 3. CHARGEMENT DU DÉCOR (Exemple : Maison/Ville)
            // Remplace l'URL par ton propre fichier .glb sur GitHub
            loader.load('https://threejs.org/examples/models/gltf/Soldier.glb', (gltf) => {
                const map = gltf.scene;
                map.scale.set(10, 10, 10); // Agrandir le décor
                scene.add(map);
            });

            // 4. L'ARME (Vue FPS)
            weapon = new THREE.Group();
            const gMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 1, roughness: 0.2 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.3, 1), gMat);
            weapon.add(body);
            weapon.position.set(0.5, -0.5, -1);
            camera.add(weapon);
            scene.add(camera);

            animate();
        }

        function fire() {
            // Son et recul
            weapon.position.z += 0.1;
            setTimeout(() => weapon.position.z -= 0.1, 50);
            // Ici on ajoute l'effet de flash à la bouche du canon
        }

        document.getElementById('fire-btn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            fire();
        });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
