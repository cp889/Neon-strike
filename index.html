<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GHOST OPS : TOTAL WAR</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffcc00; }
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: 'Oswald', sans-serif; touch-action: none; }
        
        /* INTERFACE */
        .overlay { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.8); z-index: 100; }
        .card { background: #111; border-top: 4px solid var(--gold); padding: 30px; width: 280px; text-align: center; color: white; border-radius: 10px; }
        .hidden { display: none !important; }
        button { width: 100%; padding: 15px; margin: 10px 0; background: var(--gold); border: none; font-weight: 900; cursor: pointer; text-transform: uppercase; border-radius: 5px; }

        /* HUD JEU */
        #hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; color: white; }
        .stats { position: absolute; top: 20px; left: 20px; font-size: 24px; color: var(--gold); }
        .weapon-ui { position: absolute; bottom: 20px; right: 20px; text-align: right; }
        
        /* CONTRÔLES TACTILES IPAD */
        #joystick-zone { position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border-radius: 50%; pointer-events: auto; border: 2px solid rgba(255,255,255,0.3); }
        #fire-btn { position: absolute; bottom: 40px; right: 140px; width: 90px; height: 90px; background: rgba(255,62,62,0.6); border-radius: 50%; pointer-events: auto; display: flex; justify-content: center; align-items: center; font-weight: bold; border: 3px solid white; }
        #pause-btn { position: absolute; top: 20px; right: 20px; width: 50px; height: 50px; background: rgba(0,0,0,0.5); pointer-events: auto; border: 1px solid white; border-radius: 5px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="login-screen" class="overlay">
        <div class="card">
            <h2 style="color:var(--gold)">UNITÉ D'ÉLITE</h2>
            <input type="password" id="pass" style="width:80%; padding:10px;" placeholder="CODE ACCÈS">
            <button onclick="unlock()">DÉPLOYER</button>
        </div>
    </div>

    <div id="pause-screen" class="overlay hidden">
        <div class="card">
            <h1>PAUSE</h1>
            <button onclick="resume()">REPRENDRE</button>
            <button onclick="location.reload()">RECOMMENCER</button>
            <button onclick="alert('Sensibilité: 100%')">RÉGLAGES</button>
            <button onclick="location.href='https://github.com'" style="background:#444; color:white;">QUITTER</button>
        </div>
    </div>

    <div id="hud" class="hidden">
        <div class="stats">KILLS: <span id="kill-count">0</span></div>
        <div id="pause-btn" onclick="pause()">||</div>
        <div class="weapon-ui">
            <div style="font-size:14px; opacity:0.8;">M4A1 GHOST</div>
            <div style="font-size:50px;" id="ammo-val">30</div>
        </div>
        <div id="joystick-zone"></div>
        <div id="fire-btn">TIRE</div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.150.1/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let scene, camera, renderer, clock, weapon, gunSound;
        let enemies = [], ammo = 30, kills = 0, isPaused = false;
        let moveDir = { x: 0, z: 0 };

        window.unlock = () => {
            if(document.getElementById('pass').value === "NEON2026") {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('hud').classList.remove('hidden');
                init();
            }
        };

        window.pause = () => { isPaused = true; document.getElementById('pause-screen').classList.remove('hidden'); };
        window.resume = () => { isPaused = false; document.getElementById('pause-screen').classList.add('hidden'); };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Ciel bleu (fini le noir !)
            scene.fog = new THREE.Fog(0x87CEEB, 20, 100);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputEncoding = THREE.sRGBEncoding;
            document.body.appendChild(renderer.domElement);
            clock = new THREE.Clock();

            // LUMIÈRES PUISSANTES
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
            scene.add(hemiLight);
            const sun = new THREE.DirectionalLight(0xffffff, 1);
            sun.position.set(5, 10, 7.5);
            scene.add(sun);

            // SOL (HERBE / BITUME)
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(500, 500),
                new THREE.MeshStandardMaterial({ color: 0x333333 })
            );
            ground.rotation.x = -Math.PI/2;
            scene.add(ground);

            // DÉCOR : IMMEUBLES VISIBLES
            for(let i=0; i<40; i++) {
                const h = 5 + Math.random()*15;
                const bGeo = new THREE.BoxGeometry(4, h, 4);
                const bMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
                const b = new THREE.Mesh(bGeo, bMat);
                b.position.set(Math.random()*160-80, h/2, Math.random()*160-80);
                scene.add(b);
            }

            // ARME MODÉLISÉE
            weapon = new THREE.Group();
            const gBody = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.2, 0.7), new THREE.MeshStandardMaterial({color:0x111111}));
            const gBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.5), new THREE.MeshStandardMaterial({color:0x000000}));
            gBarrel.rotation.x = Math.PI/2; gBarrel.position.z = -0.5;
            weapon.add(gBody, gBarrel);
            weapon.position.set(0.4, -0.4, -0.6);
            camera.add(weapon);
            scene.add(camera);

            // AUDIO
            const listener = new THREE.AudioListener();
            camera.add(listener);
            gunSound = new THREE.Audio(listener);
            new THREE.AudioLoader().load('https://actions.google.com/sounds/v1/weapons/fire_arm_shot.ogg', buffer => {
                gunSound.setBuffer(buffer);
            });

            // TACTILE
            document.getElementById('fire-btn').addEventListener('touchstart', (e) => { e.preventDefault(); fire(); });
            setupJoystick();

            for(let i=0; i<8; i++) spawnEnemy();
            animate();
        }

        function setupJoystick() {
            const zone = document.getElementById('joystick-zone');
            zone.addEventListener('touchmove', (e) => {
                const touch = e.touches[0];
                const rect = zone.getBoundingClientRect();
                moveDir.x = (touch.clientX - (rect.left + rect.width/2)) / 50;
                moveDir.z = (touch.clientY - (rect.top + rect.height/2)) / 50;
            });
            zone.addEventListener('touchend', () => { moveDir = {x:0, z:0}; });
        }

        function spawnEnemy() {
            const enemy = new THREE.Group();
            // Corps du soldat
            const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 1), new THREE.MeshStandardMaterial({color:0x4b5320}));
            body.position.y = 0.9;
            // Tête
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.25), new THREE.MeshStandardMaterial({color:0xdbac98}));
            head.position.y = 1.7;
            enemy.add(body, head);
            enemy.position.set(Math.random()*60-30, 0, Math.random()*60-30);
            scene.add(enemy);
            enemies.push(enemy);
        }

        function fire() {
            if(ammo <= 0 || isPaused) return;
            ammo--;
            document.getElementById('ammo-val').innerText = ammo;
            if(gunSound.buffer) gunSound.play();

            // Effet recul
            weapon.position.z += 0.05;
            setTimeout(() => weapon.position.z -= 0.05, 50);

            const ray = new THREE.Raycaster();
            ray.setFromCamera({x:0, y:0}, camera);
            const hits = ray.intersectObjects(enemies, true);
            if(hits.length > 0) {
                const t = hits[0].object.parent;
                scene.remove(t);
                enemies = enemies.filter(e => e !== t);
                kills++;
                document.getElementById('kill-count').innerText = kills;
                spawnEnemy();
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            if(isPaused) return;
            const dt = clock.getDelta();

            // Déplacement caméra (iPad)
            camera.translateX(moveDir.x * 0.2);
            camera.translateZ(moveDir.z * 0.2);
            camera.position.y = 1.7;

            enemies.forEach(e => {
                e.lookAt(camera.position);
                e.translateZ(0.03);
            });

            renderer.render(scene, camera);
        }

        // Support clavier iPad (si connecté)
        window.onkeydown = (e) => {
            if(e.code==='KeyW') moveDir.z = -1;
            if(e.code==='KeyS') moveDir.z = 1;
            if(e.code==='KeyA') camera.rotation.y += 0.05;
            if(e.code==='KeyD') camera.rotation.y -= 0.05;
            if(e.code==='Space') fire();
        };
        window.onkeyup = () => { moveDir = {x:0, z:0}; };
    </script>
</body>
</html>
