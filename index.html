<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GHOST OPS : ULTIMATE</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffcc00; --danger: #ff3e3e; }
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Oswald', sans-serif; color: white; touch-action: none; }
        
        /* UI OVERLAYS */
        .overlay { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.8); z-index: 100; }
        .card { background: #111; border-left: 4px solid var(--gold); padding: 30px; width: 300px; text-align: center; }
        .hidden { display: none !important; }
        button { width: 100%; padding: 12px; margin: 8px 0; background: var(--gold); border: none; font-family: inherit; font-weight: 900; cursor: pointer; text-transform: uppercase; }

        /* HUD & TOUCH CONTROLS */
        #hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
        .ammo-box { position: absolute; bottom: 30px; right: 30px; text-align: right; }
        #touch-fire { position: absolute; bottom: 50px; right: 150px; width: 80px; height: 80px; background: rgba(255,255,255,0.2); border-radius: 50%; pointer-events: auto; display: flex; justify-content: center; align-items: center; border: 2px solid white; }
        #pause-btn { position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; background: rgba(255,255,255,0.1); pointer-events: auto; color: white; border: 1px solid white; display:flex; align-items:center; justify-content:center;}
    </style>
</head>
<body>

    <div id="login-screen" class="overlay">
        <div class="card">
            <h2>GHOST OPS : ACCÈS</h2>
            <input type="password" id="pass" style="width:90%; padding:10px; margin-bottom:10px;" placeholder="CODE_">
            <button onclick="unlock()">AUTH_</button>
        </div>
    </div>

    <div id="pause-screen" class="overlay hidden">
        <div class="card">
            <h1>PAUSE</h1>
            <button onclick="resume()">REPRENDRE</button>
            <button onclick="location.reload()">RECOMMENCER</button>
            <button onclick="alert('Menu Principal...')">RÉGLAGES</button>
            <button onclick="window.close()" style="background:#444; color:white;">QUITTER</button>
        </div>
    </div>

    <div id="hud" class="hidden">
        <div id="pause-btn" onclick="pause()">||</div>
        <div class="ammo-box">
            <div style="font-size:12px; opacity:0.6;">M4A1 CARBINE</div>
            <div style="font-size:50px;" id="ammo-val">30</div>
        </div>
        <div id="touch-fire">FIRE</div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.150.1/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let scene, camera, renderer, clock, weapon, gunSound;
        let bots = [], ammo = 30, isPaused = false;
        let move = { f: 0, r: 0 };

        window.unlock = () => {
            if(document.getElementById('pass').value === "NEON2026") {
                document.getElementById('login-screen').classList.add('hidden');
                init();
            }
        };

        window.pause = () => { isPaused = true; document.getElementById('pause-screen').classList.remove('hidden'); };
        window.resume = () => { isPaused = false; document.getElementById('pause-screen').classList.add('hidden'); };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            scene.fog = new THREE.Fog(0x0a0a0a, 0, 150);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            clock = new THREE.Clock();

            // AUDIO
            const listener = new THREE.AudioListener();
            camera.add(listener);
            gunSound = new THREE.Audio(listener);
            const audioLoader = new THREE.AudioLoader();
            // Son de tir (libre de droit)
            audioLoader.load('https://actions.google.com/sounds/v1/weapons/fire_arm_shot.ogg', (buffer) => {
                gunSound.setBuffer(buffer);
                gunSound.setVolume(0.5);
            });

            scene.add(new THREE.AmbientLight(0xffffff, 0.4));
            
            // DÉCORS : BÂTIMENTS
            for(let i=0; i<30; i++) {
                const h = 10 + Math.random()*20;
                const b = new THREE.Mesh(new THREE.BoxGeometry(8, h, 8), new THREE.MeshStandardMaterial({color: 0x1a1a1a}));
                b.position.set(Math.random()*200-100, h/2, Math.random()*200-100);
                scene.add(b);
            }

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(500,500), new THREE.MeshStandardMaterial({color:0x111111}));
            floor.rotation.x = -Math.PI/2;
            scene.add(floor);

            // ARME
            weapon = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 1), new THREE.MeshStandardMaterial({color: 0x222222}));
            weapon.position.set(0.4, -0.4, -0.8);
            camera.add(weapon);
            scene.add(camera);

            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('touch-fire').addEventListener('touchstart', fire);
            
            for(let i=0; i<10; i++) spawnBot();
            animate();
        }

        function spawnBot() {
            const bot = new THREE.Group();
            const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.5, 1.2), new THREE.MeshStandardMaterial({color: 0x4b5320}));
            body.position.y = 1;
            bot.add(body);
            bot.position.set(Math.random()*100-50, 0, Math.random()*100-50);
            scene.add(bot);
            bots.push(bot);
        }

        function fire() {
            if(ammo <= 0 || isPaused) return;
            ammo--;
            document.getElementById('ammo-val').innerText = ammo;
            if(gunSound.isPlaying) gunSound.stop();
            gunSound.play();

            // Recul
            weapon.position.z += 0.1;
            setTimeout(() => weapon.position.z -= 0.1, 50);

            // Hitscan simple
            const ray = new THREE.Raycaster();
            ray.setFromCamera({x:0, y:0}, camera);
            const hits = ray.intersectObjects(bots, true);
            if(hits.length > 0) {
                const t = hits[0].object.parent;
                scene.remove(t);
                bots = bots.filter(b => b !== t);
                spawnBot();
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            if(isPaused) return;
            const dt = clock.getDelta();
            
            // IA & Mouvements simples
            bots.forEach(b => {
                b.lookAt(camera.position);
                b.translateZ(0.04);
            });

            renderer.render(scene, camera);
        }

        // Support Clavier iPad
        window.onkeydown = (e) => { 
            if(e.code === 'KeyW') camera.translateZ(-0.5);
            if(e.code === 'KeyS') camera.translateZ(0.5);
            if(e.code === 'KeyA') camera.rotation.y += 0.05;
            if(e.code === 'KeyD') camera.rotation.y -= 0.05;
            if(e.code === 'Space') fire();
        };
    </script>
</body>
</html>
