<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GHOST OPS : WARZONE WEB</title>
    <style>
        :root { --ui-red: #ff3e3e; --ui-gold: #ffcc00; }
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Oswald', sans-serif; }
        
        /* OVERLAYS SYSTEM */
        .screen { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.85); z-index: 100; color: white; }
        .hidden { display: none !important; }
        .menu-card { background: rgba(20,20,20,0.95); border-left: 5px solid var(--ui-gold); padding: 40px; width: 350px; box-shadow: 0 0 50px rgba(0,0,0,1); }
        
        input, select, button { width: 100%; padding: 15px; margin: 10px 0; background: #1a1a1a; border: 1px solid #333; color: white; text-transform: uppercase; letter-spacing: 1px; }
        button { background: var(--ui-gold); color: black; font-weight: 900; border: none; cursor: pointer; }
        button:hover { background: white; }

        /* HUD CALL OF DUTY STYLE */
        #hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
        .reticle { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 30px; height: 30px; border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; }
        .reticle::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 4px; height: 4px; background: red; border-radius: 50%; }
        
        .bottom-left { position: absolute; bottom: 30px; left: 30px; }
        .health-num { font-size: 40px; font-weight: bold; }
        .health-bar { width: 200px; height: 6px; background: rgba(255,255,255,0.2); margin-top: 5px; }
        #health-fill { width: 100%; height: 100%; background: white; transition: 0.2s; }

        .weapon-info { position: absolute; bottom: 30px; right: 30px; text-align: right; }
        .ammo { font-size: 50px; font-weight: bold; line-height: 1; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="login-screen" class="screen">
        <div class="menu-card">
            <h2 style="color: var(--ui-gold)">IDENTIFICATION REQUISE</h2>
            <input type="password" id="pass" placeholder="CODE D'ACCÈS">
            <button onclick="unlock()">SE CONNECTER</button>
        </div>
    </div>

    <div id="menu-screen" class="screen hidden">
        <div class="menu-card">
            <h1>GHOST OPS</h1>
            <label>ZONE D'OPÉRATION :</label>
            <select id="map">
                <option value="paris">PARIS : RUE DE RIVOLI</option>
                <option value="base">BASE MILITAIRE DÉSAFFECTÉE</option>
                <option value="space">STATION SPATIALE ISS-2</option>
            </select>
            <button onclick="startMission()">DÉPLOYER</button>
        </div>
    </div>

    <div id="hud" class="hidden">
        <div class="reticle"></div>
        <div class="bottom-left">
            <div class="health-num">100</div>
            <div class="health-bar"><div id="health-fill"></div></div>
        </div>
        <div class="weapon-info">
            <div style="font-size: 12px; opacity: 0.7;">FUSIL D'ASSAULT M4</div>
            <div class="ammo">30<span style="font-size: 20px; opacity: 0.5;"> / 90</span></div>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.150.1/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let scene, camera, renderer, clock, gun;
        let bots = [], bullets = [];
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let yaw = 0, pitch = 0;

        // --- AUTH & LAUNCH ---
        window.unlock = () => {
            if(document.getElementById('pass').value === "NEON2026") {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('menu-screen').classList.remove('hidden');
            }
        };

        window.startMission = () => {
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            initEngine();
            document.body.requestPointerLock(); // Bloque la souris pour le FPS
        };

        function initEngine() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);
            scene.fog = new THREE.Fog(0x111111, 0, 100);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);
            clock = new THREE.Clock();

            // LUMIÈRES RÉALISTES
            const ambient = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambient);
            const sun = new THREE.DirectionalLight(0xffffff, 1);
            sun.position.set(10, 20, 10);
            sun.castShadow = true;
            scene.add(sun);

            // SOL (TEXTURÉ)
            const floorGeo = new THREE.PlaneGeometry(1000, 1000);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // CRÉATION DE L'ARME (VUE FPS)
            gun = new THREE.Group();
            const barrel = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.3, 1.5), new THREE.MeshStandardMaterial({color: 0x111111}));
            barrel.position.set(0.5, -0.5, -1);
            gun.add(barrel);
            camera.add(gun);
            scene.add(camera);

            // ENNEMIS (SOLDIERS)
            for(let i=0; i<10; i++) spawnSoldier();

            // ÉCOUTEURS
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mousedown', () => shoot());
            window.addEventListener('keydown', (e) => handleKey(e.code, true));
            window.addEventListener('keyup', (e) => handleKey(e.code, false));

            animate();
        }

        function spawnSoldier() {
            const bot = new THREE.Mesh(
                new THREE.CapsuleGeometry(0.5, 1.2, 4, 8),
                new THREE.MeshStandardMaterial({ color: 0x4b5320 }) // Kaki
            );
            bot.position.set(Math.random()*100-50, 1, Math.random()*100-50);
            bot.castShadow = true;
            bot.userData = { health: 100 };
            scene.add(bot);
            bots.push(bot);
        }

        function onMouseMove(e) {
            if (document.pointerLockElement === document.body) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
                camera.rotation.order = "YXZ";
                camera.rotation.set(pitch, yaw, 0);
            }
        }

        function handleKey(code, isDown) {
            if(code === 'KeyW' || code === 'ArrowUp') moveForward = isDown;
            if(code === 'KeyS' || code === 'ArrowDown') moveBackward = isDown;
            if(code === 'KeyA' || code === 'ArrowLeft') moveLeft = isDown;
            if(code === 'KeyD' || code === 'ArrowRight') moveRight = isDown;
        }

        function shoot() {
            const bullet = new THREE.Mesh(new THREE.SphereGeometry(0.05), new THREE.MeshBasicMaterial({color: 0xffff00}));
            bullet.position.copy(camera.position);
            bullet.quaternion.copy(camera.quaternion);
            scene.add(bullet);
            bullets.push(bullet);
            setTimeout(() => { scene.remove(bullet); bullets.shift(); }, 1000);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            
            // DÉPLACEMENT
            const speed = 5 * delta;
            if (moveForward) camera.translateZ(-speed);
            if (moveBackward) camera.translateZ(speed);
            if (moveLeft) camera.translateX(-speed);
            if (moveRight) camera.translateX(speed);
            camera.position.y = 1.7; // Taille humaine

            // BALLES & COLLISIONS
            bullets.forEach((b, bi) => {
                b.translateZ(-2);
                bots.forEach((bot, botI) => {
                    if(b.position.distanceTo(bot.position) < 1) {
                        scene.remove(bot);
                        bots.splice(botI, 1);
                        spawnSoldier();
                    }
                });
            });

            // IA BOTS
            bots.forEach(bot => {
                bot.lookAt(camera.position);
                bot.translateZ(0.03);
            });

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
